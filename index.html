<!DOCTYPE html>
<html lang="es">

    <title>El Buen Sabor</title>
    
    <!-- React y Babel desde CDN para despliegue instantáneo -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

            font-family: 'BrushScriptOpti';

            font-style: normal;

        body {

            padding: 0;

            { id: 'pollo-saltado', title: 'Pollo Saltado', price: 25.00, calories: 720, image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBPf9LnARJsY_SUx0qu7q0g-jYjNcOJ8CCVlGfPd_N2IiCYyYdv1xlL3CMLxdNm7qjeuoL7QBe5qfh-c1gJUK7R7uFzDQBgiLdllM99bAVjTTkuPZsawIAoYvPOQ1rFmZBd3VdqS5OvJmkI-vqAHKv1B4Le-hPVSeHXElXzLsyOJWQggxvCJAzinZmBrQBH-NAhiJ_qiT99PK-OImg6DE5Jk1TKjzLTQmE2UDEEScgONE6wzSA7L-Vo', desc: 'Jugosos trozos de pechuga de pollo salteados al wok con cebolla, tomate y papas fritas. Acompañado de arroz blanco.', dietary: ['wheat'], nutrition: { totalFat: '12g', satFat: '2g', transFat: '0g', chol: '65mg', sodium: '1100mg', carbs: '38g', fiber: '2g', sugar: '5g', protein: '28g' } },
            { id: 'tallarin-verde', title: 'Tallarín Verde', price: 33.00, calories: 910, image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuAK1_cc6ohkp0pIIfS41-C-9Qa4L48uipSNRikjJgypgV1tJiu3a0YeClSIzJOZDZNdyoXP3Tfn5NmTvEndaAOwcCOg6QO2Nx24pP5aeNtRZizxFtB1H_PsCzp1VrY4cepj1e1teRRpUcmlA6IhHf9xxO97351ylgs0tmJiPa5dwCItkv4onQz5E0X6v6iZQU5naHkLDDV12Yo0ydQLUsLzc11WnM1no5tnrAfeUiZHQIGy5xco69iN', desc: 'Pasta al dente bañada en una cremosa salsa de albahaca y espinaca, coronada con un jugoso bisteck a la plancha.', dietary: ['leaf', 'wheat'], nutrition: { totalFat: '22g', satFat: '6g', transFat: '0g', chol: '85mg', sodium: '1250mg', carbs: '55g', fiber: '4g', sugar: '3g', protein: '32g' } }
        ];

        const SIDES = [
            { id: 'papa-huancaina', title: 'Papa a la Huancaína', image: 'https://images.unsplash.com/photo-1628294895950-9805252327bc?auto=format&fit=crop&q=80&w=200&h=200' },
            { id: 'chicha', title: 'Chicha Morada', image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBA6QJxL0f8zDooGRxqL7uENmfNpbHQFotNvaeo0h3U8-is3WGgA4kBFaR3T4Yw_M_81udX2uFjmfG0kf9EUvUzpd89ZlesWJX3QigQKQoxj2O4mfPI6iaKiyqqBwpN5Se1VhXwQy49DXP1BBefnmBCxT3yl27gwtZ7Gxf1AYBAFOVNOTnYn7vYNr37ZK0sHM1S1-dm85JtXXDVQgj6YOW6aUZg09guvuTOBtcHFulS7bh9_kQoa_w5' },
            { id: 'tequenos', title: 'Tequeños', image: 'https://images.unsplash.com/photo-1541529086526-db283c563270?auto=format&fit=crop&q=80&w=200&h=200' }
        ];

        const SplashScreen = ({ onFinish }) => (
            <div className="absolute inset-0 z-50 flex flex-col cursor-pointer overflow-hidden transition-opacity duration-500" style={{ backgroundColor: BRAND_RED }} onClick={onFinish}>
                <div className="flex-1 flex flex-col items-center justify-center relative z-10 animate-pulse">
                    <h1 className="text-white text-5xl md:text-6xl tracking-wide drop-shadow-md brush-script">El Buen Sabor</h1>
                    <p className="text-white/90 mt-3 tracking-[0.2em] text-xs uppercase font-sans font-bold">Restaurant</p>
                </div>
                {/* Patrón decorativo en el fondo */}
                <div className="absolute bottom-0 left-0 w-full h-40 opacity-10 pointer-events-none" 
                     style={{ 
                       backgroundImage: `url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 3.33333L22.357 17.643L36.6667 20L22.357 22.357L20 36.6667L17.643 22.357L3.33333 20L17.643 17.643L20 3.33333ZM20 8.33333L18.8215 18.8215L8.33333 20L18.8215 21.1785L20 31.6667L21.1785 21.1785L31.6667 20L21.1785 18.8215L20 8.33333Z' fill='%23ffffff' fill-rule='evenodd'/%3E%3C/svg%3E")`,

            </div>
        );

                <h1 className="text-white text-3xl drop-shadow-sm brush-script">El Buen Sabor</h1>
                <p className="text-white/80 text-[9px] tracking-[0.25em] uppercase font-bold mt-1">Restaurant</p>
            </div>
        );

        const MenuScreen = ({ onSelectItem, onOpenCart, cartCount }) => (
            <div className="h-full bg-white flex flex-col relative overflow-hidden">
                <div className="flex-1 overflow-y-auto no-scrollbar pb-28">
                    <TopHeader />
                    <div className="px-5 mt-6">
                        <h3 className="text-[11px] font-black text-gray-400 tracking-widest uppercase mb-4 pl-1">Especialidades</h3>

                                        <img src={item.image} alt={item.title} className="w-full h-full object-cover" />

                                    <div className="px-1 pb-1">

                                            <div>
                                                <h4 className="font-bold text-gray-900 text-lg leading-tight">{item.title}</h4>
                                                <p className="text-gray-400 text-[11px] mt-1 font-medium">{item.calories} calorías</p>
                                            </div>
                                            <span className="font-bold text-gray-900 text-base">S/ {item.price.toFixed(2)}</span>

                            <div className="w-[1px] h-5 bg-gray-600 rounded-full"></div>
                            <button className="text-white hover:opacity-80 transition-opacity"><IconSearch size={20} strokeWidth={2.5} /></button>

        );

            const [qty, setQty] = useState(1);
            return (
                <div className="h-full bg-white flex flex-col relative overflow-hidden">
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-24 relative">
                        <div className="absolute top-0 w-full h-44 rounded-b-[40px] z-0" style={{ backgroundColor: BRAND_RED }}></div>
                        <div className="relative z-20 flex justify-between items-center px-4 pt-8 pb-2">

                            <div className="w-10"></div>
                        </div>
                        <div className="relative z-10 px-5 mt-4">

                            </div>
                        </div>
                        <div className="px-6 mt-6">

                            </div>

                            <p className="text-gray-600 text-sm leading-relaxed mb-6 font-medium">{item.desc}</p>
                            
                            <div className="flex gap-3 mb-8 border-b border-gray-100 pb-8">
                                <div className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-500 shadow-sm border border-gray-100"><IconWheatOff size={18} strokeWidth={2.5} /></div>
                                {item.dietary.includes('leaf') && <div className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-green-600 shadow-sm border border-gray-100"><IconLeaf size={18} strokeWidth={2.5} /></div>}

                            <h3 className="text-[11px] font-black text-gray-900 tracking-widest uppercase mb-4">Acompañamientos</h3>
                            <div className="flex overflow-x-auto gap-4 pb-6 -mx-6 px-6 no-scrollbar snap-x">

                                        </div>
                                        <p className="text-[11px] text-center text-gray-700 font-bold leading-tight">{side.title}</p>
                                    </div>

            const total = subtotal + igv;

                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {cartItems.map((item, idx) => (
                                        <div key={idx} className="bg-white rounded-3xl p-3 flex gap-4 shadow-sm items-center border border-gray-50 relative overflow-hidden">
                                            <div className="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0 bg-gray-100"><img src={item.image} alt={item.title} className="w-full h-full object-cover" /></div>
                                            <div className="flex-1 pr-6"><h4 className="font-bold text-gray-900 leading-tight">{item.title}</h4><p className="text-xs text-gray-400 mt-1 font-medium">Cant: {item.qty}</p><p className="font-black text-gray-900 mt-1" style={{ color: BRAND_RED }}>S/ {(item.price * item.qty).toFixed(2)}</p></div>
                                            <button onClick={() => onRemove(idx)} className="absolute top-3 right-3 w-8 h-8 flex items-center justify-center text-gray-300 hover:text-red-500 bg-gray-50 rounded-full transition-colors"><IconX size={16} strokeWidth={3} /></button>
                                        </div>
                                    ))}
                                    <div className="bg-white rounded-3xl p-5 mt-8 shadow-sm border border-gray-50">
                                        <div className="flex justify-between text-sm text-gray-500 mb-3 font-medium"><span>Subtotal</span><span className="text-gray-900">S/ {subtotal.toFixed(2)}</span></div>
                                        <div className="flex justify-between text-sm text-gray-500 mb-4 font-medium"><span>IGV (18%)</span><span className="text-gray-900">S/ {igv.toFixed(2)}</span></div>
                                        <div className="h-[1px] w-full bg-gray-100 mb-4"></div>
                                        <div className="flex justify-between items-center"><span className="font-bold text-gray-900">Total</span><span className="font-black text-2xl" style={{ color: BRAND_RED }}>S/ {total.toFixed(2)}</span></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {cartItems.length > 0 && (
                        <div className="absolute bottom-0 left-0 w-full bg-white/80 backdrop-blur-md p-5 z-40 border-t border-gray-100 shadow-[0_-10px_20px_rgba(0,0,0,0.03)]"><button onClick={onCheckout} className="w-full text-white font-black py-4 rounded-2xl shadow-lg transform active:scale-95 transition-transform tracking-wide" style={{ backgroundColor: BRAND_RED }}>Confirmar Pedido</button></div>
                    )}
                </div>
            );
        };

        const ConfirmationScreen = ({ onReturnHome }) => (
            <div className="h-full bg-white flex flex-col items-center justify-center p-6 text-center relative transition-opacity duration-500">
                <div className="absolute top-0 w-full h-1/3 rounded-b-[60px] z-0 opacity-5" style={{ backgroundColor: BRAND_RED }}></div>
                <div className="relative z-10 flex flex-col items-center">
                    <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mb-6 shadow-inner border-[4px] border-green-100"><IconCheckCircle size={40} className="text-green-600" strokeWidth={2.5} /></div>
                    <h1 className="text-3xl font-black text-gray-900 mb-3 tracking-tight">¡Pedido Enviado!</h1>
                    <p className="text-gray-500 mb-10 max-w-[250px] leading-relaxed font-medium text-sm">Tu mozo ha recibido la orden y la cocina ya está preparando tu comida.</p>
                    <button onClick={onReturnHome} className="px-10 py-4 text-white font-black rounded-2xl shadow-lg transform active:scale-95 transition-transform" style={{ backgroundColor: BRAND_RED }}>Volver al Inicio</button>
                </div>
            </div>
        );

        function App() {
            const [currentView, setCurrentView] = useState('splash');
            const [selectedItem, setSelectedItem] = useState(null);
            const [cart, setCart] = useState([]);
            
            useEffect(() => {
                if (currentView === 'splash') {
                    const timer = setTimeout(() => setCurrentView('menu'), 3500);
                    return () => clearTimeout(timer);
                }
            }, [currentView]);

            return (
                <div className="min-h-screen w-full flex items-center justify-center font-sans overflow-hidden bg-white sm:bg-gray-200">
                    <div className="w-full h-[100dvh] sm:h-[844px] sm:w-[390px] bg-white relative overflow-hidden sm:rounded-[2.5rem] sm:border-[10px] sm:border-black sm:shadow-2xl flex flex-col">
                        {currentView === 'splash' && <SplashScreen onFinish={() => setCurrentView('menu')} />}
                        {currentView === 'menu' && <MenuScreen cartCount={cart.reduce((s, i) => s + i.qty, 0)} onSelectItem={(item) => { setSelectedItem(item); setCurrentView('detail'); }} onOpenCart={() => setCurrentView('cart')} />}
                        {currentView === 'detail' && selectedItem && <DetailScreen item={selectedItem} onBack={() => setCurrentView('menu')} onAddToCart={(item, qty) => { setCart([...cart, { ...item, qty }]); setCurrentView('menu'); }} />}
                        {currentView === 'cart' && <CartScreen cartItems={cart} onBack={() => setCurrentView('menu')} onRemove={(idx) => setCart(cart.filter((_, i) => i !== idx))} onCheckout={() => { setCart([]); setCurrentView('confirmation'); }} />}
                        {currentView === 'confirmation' && <ConfirmationScreen onReturnHome={() => setCurrentView('menu')} />}
                    </div>
                </div>
            );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
